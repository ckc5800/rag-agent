name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      # 임포트가 깨진 조합(예: mcp 2.0 + langchain-mcp-adapters 0.3)이 잡히면
      # 단위 테스트는 통과하는데 실행만 죽는다. 진입점 임포트를 먼저 확인한다.
      - name: 진입점 임포트 확인
        run: python -c "import sys; sys.path.insert(0,'src'); import graph, agent, team, api, mcp_agent"
        env:
          PYTHONUTF8: "1"
      - run: pytest -q tests
      # 인덱싱 대상 텍스트에 정제가 놓친 노이즈가 남으면 실패시킨다.
      # 임베딩·LLM이 필요 없어 CI에서 몇 초면 끝난다.
      - name: 데이터 검수 (인덱싱 전 0단계)
        run: python src/inspect_data.py --strict
        env:
          PYTHONUTF8: "1"
